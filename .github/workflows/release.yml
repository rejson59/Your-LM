name: Release RC17 balanced-phone gates

on:
  push:
    branches: [arena/395e51e3-your-lm]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLISH_RELEASE: ${{ contains(github.event.head_commit.message, '[publish v0.2.0-rc17]') }}
  ANDROID_CERT_SHA256: bb2639f3d49a2d7db0845884e76d6bb51152a6e9c0df92fcfe885a26c5de94a6

jobs:
  host-tests:
    name: Go, recipe and pinned-patch gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - name: Test host, automatic profile and streaming recipe
        shell: bash
        run: |
          set -euo pipefail
          set +e
          TEST_HF_GOLDEN=1 go test -mod=vendor ./host 2>&1 | tee "$RUNNER_TEMP/host-tests.log"
          test_status=${PIPESTATUS[0]}
          set -e
          if (( test_status != 0 )); then
            tail_output=$(tail -n 100 "$RUNNER_TEMP/host-tests.log")
            tail_output=${tail_output//'%'/'%25'}
            tail_output=${tail_output//$'\r'/'%0D'}
            tail_output=${tail_output//$'\n'/'%0A'}
            echo "::error title=Go host tests failed::$tail_output"
            exit "$test_status"
          fi
          node --check host/web/app.js
          bash -n scripts/apply-smolmaxxing-patch.sh scripts/build-smol-android.sh scripts/package-android.sh
          echo 'f0677c48522e1659969998654d83db9ede7652e771e045dbcd35427abd0230bd  patches/smolmaxxing-8d12bb1-llama-v0.8.0.patch' | sha256sum -c -
          grep -Fq 'smolmaxxing expert pager' licenses/components.txt
          test -s licenses/smolmaxxing.txt

  android-arm64:
    needs: host-tests
    name: Android ARM64 release gate
    if: ${{ !contains(github.event.head_commit.message, '[publish ready]') && !contains(github.event.head_commit.message, '[validate fast]') && !contains(github.event.head_commit.message, '[publish rc17 fast]') }}
    # Draft releases containing the split stable-signing backup are visible
    # only to tokens with push-level contents access.
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
      - name: Fetch pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin c0b97be0b297177a88df08e96c01420976bb18d0
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
          git init "$RUNNER_TEMP/llama-smol.cpp"
          git -C "$RUNNER_TEMP/llama-smol.cpp" remote add origin https://github.com/ggml-org/llama.cpp
          git -C "$RUNNER_TEMP/llama-smol.cpp" fetch --depth 1 origin 8642541b255bfb5dc39cd351a178be09013a55d6
          git -C "$RUNNER_TEMP/llama-smol.cpp" checkout --detach FETCH_HEAD
      - name: Exercise bounded RPC cache miss, hit, and recovery
        shell: bash
        run: |
          set -euo pipefail
          export LLAMA_SRC="$RUNNER_TEMP/llama.cpp"
          export JOBS=2
          tests/rpc-cache-smoke.sh "$RUNNER_TEMP/rpc-cache-smoke"
      - name: Build and inspect Android ARM64 PIE executables
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export LLAMA_SRC="$RUNNER_TEMP/llama.cpp"
          export JOBS=2
          scripts/build-native.sh build/android-native
          export SMOL_LLAMA_SRC="$RUNNER_TEMP/llama-smol.cpp"
          scripts/build-smol-android.sh build/android-smol-native
      - name: Assemble the stable-signed RC17 APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/restore-android-signing.sh "$RUNNER_TEMP/yourlm-android.p12" "$RUNNER_TEMP/yourlm-android.pass"
          export KEYSTORE="$RUNNER_TEMP/yourlm-android.p12"
          export KS_PASS="$(cat "$RUNNER_TEMP/yourlm-android.pass")"
          export EXPECTED_ANDROID_CERT_SHA256="$ANDROID_CERT_SHA256"
          export RPC_BIN="$PWD/build/android-native/bin/ggml-rpc-server"
          export SERVER_BIN="$PWD/build/android-native/bin/llama-server"
          export SMOL_SERVER_BIN="$PWD/build/android-smol-native/bin/llama-server"
          scripts/package-android.sh
      - name: Audit the stable-signed release APK and exact native payloads
        shell: bash
        run: |
          set -euo pipefail
          apk=packages/YourLM-Android-arm64.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          cert=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ "$cert" == "$ANDROID_CERT_SHA256" ]] || { echo "Unexpected Android signing identity" >&2; exit 1; }
          badging=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")
          grep -Fq "versionCode='20'" <<<"$badging"
          grep -Fq "versionName='0.2.0-rc17'" <<<"$badging"
          unzip -p "$apk" assets/BUILDINFO.txt | grep -Fq 'RPC compatibility: b12562-ylm-rpc5'
          unzip -p "$apk" assets/BUILDINFO.txt | grep -Fq 'smolmaxxing llama.cpp base: v0.8.0 / 8642541b255bfb5dc39cd351a178be09013a55d6'
          unzip -p "$apk" assets/licenses/smolmaxxing.txt | grep -Fq 'MIT License'
          mkdir -p "$RUNNER_TEMP/apk-audit"
          unzip -q "$apk" 'lib/arm64-v8a/*.so' -d "$RUNNER_TEMP/apk-audit"
          cmp build/android-native/bin/ggml-rpc-server "$RUNNER_TEMP/apk-audit/lib/arm64-v8a/libylm_rpc.so"
          cmp build/android-native/bin/llama-server "$RUNNER_TEMP/apk-audit/lib/arm64-v8a/libylm_server.so"
          cmp build/android-smol-native/bin/llama-server "$RUNNER_TEMP/apk-audit/lib/arm64-v8a/libylm_smol.so"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ANDROID_ABI=arm64-v8a scripts/verify-android-elf.sh "$RUNNER_TEMP/apk-audit/lib/arm64-v8a/"*.so
          unzip -p "$apk" assets/BUILDINFO.txt
      - name: Upload Android ARM64 build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64-build
          path: |
            build/android-native/bin/ggml-rpc-server
            build/android-native/bin/llama-server
            build/android-smol-native/bin/llama-server
            packages/YourLM-Android-arm64.apk
          if-no-files-found: error
          retention-days: 14

  android-runtime:
    name: Android x86_64 runtime gate
    # The emulator is an optional smoke test, not a publication gate; physical
    # Android/Windows testing is more representative for the RPC transfer.
    if: ${{ contains(github.event.head_commit.message, '[test emulator]') }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
      - name: Fetch pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin c0b97be0b297177a88df08e96c01420976bb18d0
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
      - name: Build Android x86_64 equivalents
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export LLAMA_SRC="$RUNNER_TEMP/llama.cpp"
          export ANDROID_ABI=x86_64
          export JOBS=2
          scripts/build-native.sh build/android-x86-native
      - name: Assemble the x86_64 emulator test APK
        shell: bash
        run: |
          set -euo pipefail
          : "${JAVA_HOME_17_X64:?macOS runner must provide JDK 17}"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/android-gate.jks" \
            -storepass yourlm-gate -keypass yourlm-gate -alias yourlm \
            -dname "CN=YourLM CI" -keyalg RSA -keysize 2048 -validity 2
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_ABI=x86_64
          export KEYSTORE="$RUNNER_TEMP/android-gate.jks"
          export KS_PASS=yourlm-gate
          export RPC_BIN="$PWD/build/android-x86-native/bin/ggml-rpc-server"
          export SERVER_BIN="$PWD/build/android-x86-native/bin/llama-server"
          export APK_OUT="$RUNNER_TEMP/YourLM-Android-x86_64-test.apk"
          scripts/package-android.sh
      - name: Execute native payloads, worker, pairing and phone host
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: /bin/bash tests/android-emulator-gate.sh "$RUNNER_TEMP/YourLM-Android-x86_64-test.apk"
      - name: Upload Android runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-runtime-evidence
          path: |
            test-output/android-home.png
            test-output/android-worker-ready.png
            test-output/android-worker-ready.xml
            test-output/android-host.png
          if-no-files-found: error
          retention-days: 14

  windows-standalone:
    name: Build standalone Windows x64
    needs: android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-arm64-build
          path: .
      - name: Install pinned Zig compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/zig" ziglang==0.14.1
          echo "$RUNNER_TEMP/zig/ziglang" >> "$GITHUB_PATH"
      - name: Fetch pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin c0b97be0b297177a88df08e96c01420976bb18d0
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
      - name: Build and inspect the one-file Windows application
        shell: bash
        run: |
          set -euo pipefail
          export LLAMA_SRC="$RUNNER_TEMP/llama.cpp"
          export JOBS=2
          scripts/regenerate-windows-resource.sh
          git diff --exit-code -- host/resource_windows_amd64.syso
          scripts/build-windows.sh
          mkdir -p release-scan
          cp build/windows-native/llama/bin/llama-server.exe release-scan/
          cp build/windows-native/llama/bin/ggml-rpc-server.exe release-scan/
          test "$(head -c2 packages/YourLM.exe)" = MZ
          ls -lh packages/YourLM.exe packages/YourLM-Android-arm64.apk
          (cd packages && sha256sum -c SHA256SUMS)
      - name: Upload standalone Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-standalone-build
          path: |
            packages/YourLM.exe
            packages/SHA256SUMS
            release-scan/llama-server.exe
            release-scan/ggml-rpc-server.exe
          if-no-files-found: error
          retention-days: 14

  windows-runtime:
    name: Windows first-run functional gate
    needs: [android-arm64, windows-standalone]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-arm64-build
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-standalone-build
          path: .
      - name: Compile and test Windows cleanup safeguards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'host\embedded' | Out-Null
          @('runtime.zip', 'platform-tools.zip', 'YourLM-Android-arm64.apk') | ForEach-Object {
            [IO.File]::WriteAllBytes((Join-Path 'host\embedded' $_), [byte[]]@())
          }
          $testOutput = @()
          $testExit = 1
          try {
            $testOutput = @(& go test -mod=vendor ./host 2>&1)
            $testExit = $LASTEXITCODE
            $testOutput | ForEach-Object { Write-Host "$_" }
          } finally {
            for ($attempt = 0; $attempt -lt 10 -and (Test-Path -LiteralPath 'host\embedded'); $attempt++) {
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'host\embedded'
              if (Test-Path -LiteralPath 'host\embedded') { Start-Sleep -Milliseconds 500 }
            }
          }
          if ($testExit -ne 0) {
            $tail = (($testOutput | Select-Object -Last 80 | ForEach-Object { "$_" }) -join "`n")
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows Go tests failed::$escaped"
            throw "Windows Go tests failed with exit code $testExit"
          }
          if (Test-Path -LiteralPath 'host\embedded') { throw 'Temporary Windows embed stubs remained locked after tests' }
      - name: Exercise installation, diagnostics, migration and native WebView2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'YourLM-Windows-Gate'
          $env:LOCALAPPDATA = Join-Path $root 'LocalAppData'
          $env:APPDATA = Join-Path $root 'AppDataRoaming'
          $env:YOURLM_DISABLE_DRIVE_MIGRATION = '1'
          $source = (Resolve-Path 'packages\YourLM.exe').Path
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\YourLM\YourLM.exe'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\YourLM.lnk'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\YourLM'

          $install = Start-Process -FilePath $source -ArgumentList '--install-only' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Per-user installation exited with $($install.ExitCode)" }
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) { throw 'Per-user EXE was not installed' }
          if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) { throw 'Start Menu shortcut was not created' }
          if ((Get-ItemProperty -LiteralPath $uninstallKey).DisplayVersion -ne '0.2.0-rc17') { throw 'Installed Apps version is incorrect' }

          $controllerOut = Join-Path $root 'controller.out'
          $controllerErr = Join-Path $root 'controller.err'
          $process = Start-Process -FilePath $installed -ArgumentList '--no-browser' -RedirectStandardOutput $controllerOut -RedirectStandardError $controllerErr -PassThru
          $controllerText = ''
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) { throw "YourLM exited during first run with $($process.ExitCode): $(Get-Content -Raw -ErrorAction SilentlyContinue $controllerErr)" }
            if (Test-Path -LiteralPath $controllerOut) { $controllerText = Get-Content -Raw -LiteralPath $controllerOut }
            if ($controllerText -match '(?m)^http://127\.0\.0\.1:[0-9]+/#[0-9a-f]+$') { break }
          }
          $controllerMatch = [regex]::Match($controllerText, '(?m)^(http://127\.0\.0\.1:[0-9]+)/#([0-9a-f]+)$')
          if (-not $controllerMatch.Success) { throw "Controller URL was not emitted: $controllerText" }
          $controllerBase = $controllerMatch.Groups[1].Value
          $controllerHeaders = @{ 'X-YourLM' = $controllerMatch.Groups[2].Value }

          $component = Get-ChildItem (Join-Path $env:APPDATA 'YourLM\components') -Directory | Select-Object -First 1
          if (-not $component) { throw 'First run did not extract private components' }
          $required = @(
            'runtime\llama-server.exe',
            'runtime\ggml-rpc-server.exe',
            'platform-tools\adb.exe',
            'platform-tools\AdbWinApi.dll',
            'platform-tools\AdbWinUsbApi.dll',
            'YourLM-Android-arm64.apk',
            '.complete'
          )
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path $component.FullName $name))) { throw "Missing extracted component: $name" }
          }
          $embeddedApk = Get-FileHash -Algorithm SHA256 (Join-Path $component.FullName 'YourLM-Android-arm64.apk')
          $releaseApk = Get-FileHash -Algorithm SHA256 'packages\YourLM-Android-arm64.apk'
          if ($embeddedApk.Hash -ne $releaseApk.Hash) { throw 'Embedded APK differs from release APK' }

          $initialState = Invoke-RestMethod -Uri "$controllerBase/api/state" -Headers $controllerHeaders
          if ($initialState.diagnostics.recommendation.readyToApply) { throw 'Autopilot was enabled before collecting hardware facts' }
          Invoke-RestMethod -Method Post -Uri "$controllerBase/api/diagnostics-start" -Headers $controllerHeaders -ContentType 'application/json' -Body '{}' | Out-Null
          $diagnosticState = $null
          for ($attempt = 0; $attempt -lt 180; $attempt++) {
            Start-Sleep -Milliseconds 500
            $diagnosticState = Invoke-RestMethod -Uri "$controllerBase/api/state" -Headers $controllerHeaders
            if (-not $diagnosticState.diagnostics.running) { break }
          }
          if (-not $diagnosticState.diagnostics.complete) { throw "Windows diagnostics did not complete: $($diagnosticState.diagnostics.error)" }
          if (-not $diagnosticState.diagnostics.host.cpu -or $diagnosticState.diagnostics.host.cpu -eq '0') { throw 'Windows diagnostics did not identify the CPU' }
          if ($diagnosticState.diagnostics.benchmark.cpuHashBps -le 0 -or $diagnosticState.diagnostics.benchmark.diskWriteBps -le 0) { throw 'Windows diagnostics did not measure CPU and managed storage' }
          if ($diagnosticState.diagnostics.recommendation.selectedId -ne 'qwen36-35b-a3b-abliterated-balanced') { throw 'Autopilot selected an unaudited recipe' }
          if (-not $diagnosticState.diagnostics.recommendation.readyToApply) { throw 'Autopilot did not unlock after diagnostics' }
          if (-not (Test-Path -LiteralPath $diagnosticState.diagnostics.reportPath -PathType Leaf)) { throw 'Diagnostics report was not persisted' }

          Stop-Process -Id $process.Id -Force
          & (Join-Path $component.FullName 'platform-tools\adb.exe') kill-server 2>$null

          $native = Start-Process -FilePath $installed -PassThru
          $windowReady = $false
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            Start-Sleep -Seconds 1
            $native.Refresh()
            if ($native.HasExited) { throw "YourLM native window exited early with $($native.ExitCode)" }
            if ($native.MainWindowHandle -ne 0 -and $native.MainWindowTitle -like 'YourLM*') {
              $windowReady = $true
              break
            }
          }
          if (-not $windowReady) { throw 'YourLM did not create its native WebView2 application window' }
          Stop-Process -Id $native.Id -Force

          $remove = Start-Process -FilePath $installed -ArgumentList '--uninstall' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall exited with $($remove.ExitCode)" }
          for ($attempt = 0; $attempt -lt 80 -and (Test-Path -LiteralPath $installed); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $installed) { throw 'Uninstall did not remove the installed EXE' }
          if (Test-Path -LiteralPath $shortcut) { throw 'Uninstall did not remove the Start Menu shortcut' }
          if (Test-Path -LiteralPath $uninstallKey) { throw 'Uninstall did not remove the Installed Apps entry' }

          # Exercise the RC17 managed-drive path and verified migration using a
          # fixed-volume directory override. This keeps the hosted runner
          # deterministic even though its real D: scratch disk varies.
          Remove-Item Env:YOURLM_DISABLE_DRIVE_MIGRATION
          $managedRoot = Join-Path $root 'Managed-D-YourLM'
          $env:YOURLM_WINDOWS_ROOT = $managedRoot
          $env:APPDATA = Join-Path $root 'MigrationAppDataRoaming'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\YourLM.lnk'
          $legacyData = Join-Path $env:APPDATA 'YourLM'
          New-Item -ItemType Directory -Force (Join-Path $legacyData 'models') | Out-Null
          $migrationFixture = 'verified migration fixture with a resumable prefix'
          [IO.File]::WriteAllText((Join-Path $legacyData 'models\resume.gguf.part'), $migrationFixture)
          $managedExe = Join-Path $managedRoot 'App\YourLM.exe'
          $managedData = Join-Path $managedRoot 'Data'
          # Reproduce the field failure exactly: RC16 left a valid prefix at
          # Data.migrating\...migrating-part. RC17 must validate and append it,
          # not delete the source and not fail with ERROR_FILE_EXISTS.
          $stagingModel = Join-Path $managedRoot 'Data.migrating\models\resume.gguf.part.migrating-part'
          New-Item -ItemType Directory -Force (Split-Path -Parent $stagingModel) | Out-Null
          [IO.File]::WriteAllText($stagingModel, $migrationFixture.Substring(0, 19))

          $managedInstall = Start-Process -FilePath $source -ArgumentList '--install-only' -Wait -PassThru
          if ($managedInstall.ExitCode -ne 0) { throw "Managed-drive installation exited with $($managedInstall.ExitCode)" }
          if (-not (Test-Path -LiteralPath $managedExe -PathType Leaf)) { throw 'EXE was not installed in the managed drive root' }
          if ((Get-ItemProperty -LiteralPath $uninstallKey).InstallLocation -ne (Split-Path -Parent $managedExe)) { throw 'Installed Apps did not move to the managed drive root' }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
          if ($link.TargetPath -ne $managedExe) { throw 'Start Menu shortcut did not move to the managed drive root' }

          $managedOut = Join-Path $root 'managed-controller.out'
          $managedErr = Join-Path $root 'managed-controller.err'
          $managedProcess = Start-Process -FilePath $managedExe -ArgumentList '--no-browser' -RedirectStandardOutput $managedOut -RedirectStandardError $managedErr -PassThru
          $managedText = ''
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            Start-Sleep -Milliseconds 500
            $managedProcess.Refresh()
            if ($managedProcess.HasExited) { throw "Managed-drive first run exited with $($managedProcess.ExitCode): $(Get-Content -Raw -ErrorAction SilentlyContinue $managedErr)" }
            if (Test-Path -LiteralPath $managedOut) { $managedText = Get-Content -Raw -LiteralPath $managedOut }
            if ((Test-Path -LiteralPath (Join-Path $managedData '.yourlm-storage-v1')) -and $managedText -match '(?m)^http://127\.0\.0\.1:[0-9]+/#[0-9a-f]+$') { break }
          }
          $managedMatch = [regex]::Match($managedText, '(?m)^(http://127\.0\.0\.1:[0-9]+)/#([0-9a-f]+)$')
          if (-not $managedMatch.Success) { throw "Managed controller URL was not emitted: $managedText" }
          $managedState = Invoke-RestMethod -Uri "$($managedMatch.Groups[1].Value)/api/state" -Headers @{ 'X-YourLM' = $managedMatch.Groups[2].Value }
          if ($managedState.storage.migration.status -ne 'recovered') { throw "Stale part was not reported as recovered: $($managedState.storage.migration.status)" }
          if ($managedState.storage.migration.resumedFiles -ne 1 -or $managedState.storage.migration.resumedBytes -ne 19) { throw 'Resumed migration metrics are incorrect' }
          if ($managedState.storage.dataPath -ne $managedData) { throw 'Published D: storage is not active in application state' }
          $storageKey = 'HKCU:\Software\YourLM'
          if ((Get-ItemProperty -LiteralPath $storageKey).StorageRoot -ne $managedRoot) { throw 'Managed storage root was not persisted for future updates' }
          if (-not (Test-Path -LiteralPath (Join-Path $managedData 'models\resume.gguf.part') -PathType Leaf)) { throw 'Existing model fragment was not migrated to managed storage' }
          if ((Get-Content -Raw -LiteralPath (Join-Path $managedData 'models\resume.gguf.part')) -ne $migrationFixture) { throw 'Resumed model fragment changed' }
          if (Test-Path -LiteralPath $stagingModel) { throw 'The .migrating-part file leaked into published storage' }
          if (Test-Path -LiteralPath (Join-Path $managedRoot 'Data.migrating')) { throw 'Staging directory remained after atomic publication' }
          if (Test-Path -LiteralPath $legacyData) { throw 'Verified legacy data was not retired after migration' }
          $migrationLock = Join-Path $managedRoot '.yourlm-data-migration.lock'
          if (-not (Test-Path -LiteralPath $migrationLock -PathType Leaf)) { throw 'Migration lock evidence is missing' }
          if ((Get-Item -LiteralPath $migrationLock).Length -ne 0) { throw 'Migration lock remained owned after startup' }
          Stop-Process -Id $managedProcess.Id -Force

          $managedRemove = Start-Process -FilePath $managedExe -ArgumentList '--uninstall' -Wait -PassThru
          if ($managedRemove.ExitCode -ne 0) { throw "Managed uninstall exited with $($managedRemove.ExitCode)" }
          for ($attempt = 0; $attempt -lt 80 -and (Test-Path -LiteralPath $managedExe); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Test-Path -LiteralPath $managedExe) { throw 'Managed uninstall did not remove the EXE' }
          if (-not (Test-Path -LiteralPath $managedData)) { throw 'Managed uninstall removed the private model library' }
  publish-rc:
    name: Publish v0.2.0-rc17 assets
    if: ${{ contains(github.event.head_commit.message, '[publish v0.2.0-rc17]') }}
    needs: [windows-runtime]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-arm64-build
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-standalone-build
          path: .
      - name: Verify and publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd packages && sha256sum -c SHA256SUMS)
          tag=v0.2.0-rc17
          assets=(packages/YourLM.exe packages/YourLM-Android-arm64.apk packages/SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --prerelease --title 'YourLM 0.2.0-rc17' \
              --notes-file windows/RELEASE-NOTES-0.2.0-rc17.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --prerelease --target "$GITHUB_SHA" \
              --title 'YourLM 0.2.0-rc17' --notes-file windows/RELEASE-NOTES-0.2.0-rc17.md \
              --repo "$GITHUB_REPOSITORY"
          fi
