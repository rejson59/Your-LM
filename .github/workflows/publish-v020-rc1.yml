name: Publish verified 0.2.0 RC assets

on:
  push:
    branches: [arena/395e51e3-your-lm]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ contains(github.event.head_commit.message, '[publish verified rc1]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download ARM64 APK that passed its release gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-arm64-build
          path: .
          github-token: ${{ github.token }}
          run-id: 44788921798
      - name: Download standalone EXE that passed first-run and Defender gates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-standalone-build
          path: .
          github-token: ${{ github.token }}
          run-id: 44788921798
      - name: Verify and publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd packages && sha256sum -c SHA256SUMS)
          test "$(head -c2 packages/YourLM.exe)" = MZ
          tag=v0.2.0-rc1
          assets=(packages/YourLM.exe packages/YourLM-Android-arm64.apk packages/SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --prerelease --title 'YourLM 0.2.0-rc1' \
              --notes-file windows/RELEASE-NOTES-0.2.0-rc1.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --prerelease --target "$GITHUB_SHA" \
              --title 'YourLM 0.2.0-rc1' --notes-file windows/RELEASE-NOTES-0.2.0-rc1.md \
              --repo "$GITHUB_REPOSITORY"
          fi
