name: Fast RC13 validation and publication

on:
  push:
    branches: [arena/395e51e3-your-lm]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ANDROID_CERT_SHA256: bb2639f3d49a2d7db0845884e76d6bb51152a6e9c0df92fcfe885a26c5de94a6

jobs:
  validate:
    # RC13 changes the Java/Go control planes and deliberately reuses the exact
    # patched native binaries built and audited by release run 45040206040.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[validate fast]') || contains(github.event.head_commit.message, '[publish rc13 fast]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - name: Verify patched native artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run=45040206040
          expected=4b8fe08f1985577316fdbcb7b383c708c6065dc1
          [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha) == "$expected" ]]
          for job in \
            'Android ARM64 release gate' \
            'Build standalone Windows x64' \
            'Windows first-run functional gate'; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"$job\") | .conclusion")
            [[ "$conclusion" == success ]] || { echo "$job did not pass" >&2; exit 1; }
          done
      - name: Reuse patched native Windows runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-standalone-build
          path: ${{ runner.temp }}/base
          github-token: ${{ github.token }}
          run-id: '45040206040'
      - name: Reuse patched native Android ARM64 runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-arm64-build
          path: ${{ runner.temp }}/android
          github-token: ${{ github.token }}
          run-id: '45040206040'
      - name: Ensure Android packaging tools
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Compile, stable-sign and audit the RC13 Android application
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/restore-android-signing.sh "$RUNNER_TEMP/yourlm-android.p12" "$RUNNER_TEMP/yourlm-android.pass"
          export KEYSTORE="$RUNNER_TEMP/yourlm-android.p12"
          export KS_PASS="$(cat "$RUNNER_TEMP/yourlm-android.pass")"
          export EXPECTED_ANDROID_CERT_SHA256="$ANDROID_CERT_SHA256"
          export RPC_BIN="$RUNNER_TEMP/android/build/android-native/bin/ggml-rpc-server"
          export SERVER_BIN="$RUNNER_TEMP/android/build/android-native/bin/llama-server"
          set +e
          scripts/package-android.sh 2>&1 | tee "$RUNNER_TEMP/android-package.log"
          package_status=${PIPESTATUS[0]}
          set -e
          if (( package_status != 0 )); then
            python3 - "$RUNNER_TEMP/android-package.log" <<'PY'
          from pathlib import Path
          from sys import argv
          detail = "\n".join(Path(argv[1]).read_text(errors="replace").splitlines()[-60:])
          detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Android package failed::{detail}")
          PY
            exit "$package_status"
          fi
          apk=packages/YourLM-Android-arm64.apk
          badging=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")
          grep -Fq "versionCode='16'" <<<"$badging"
          grep -Fq "versionName='0.2.0-rc13'" <<<"$badging"
          cert=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          [[ "$cert" == "$ANDROID_CERT_SHA256" ]]
          unzip -p "$apk" assets/BUILDINFO.txt | grep -Fq 'RPC compatibility: b12562-ylm-rpc5'
      - name: Test and build the updated standalone EXE
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l host/*.go)
          [[ -z "$unformatted" ]] || { echo "Go files need gofmt: $unformatted" >&2; exit 1; }
          go test -mod=vendor ./...
          go vet -mod=vendor ./...
          node --check host/web/app.js
          node --check host/web/theme.js
          server_file="$RUNNER_TEMP/base/release-scan/llama-server.exe"
          rpc_file="$RUNNER_TEMP/base/release-scan/ggml-rpc-server.exe"
          test -s "$server_file"
          test -s "$rpc_file"
          test -s packages/YourLM-Android-arm64.apk
          scripts/regenerate-windows-resource.sh
          git diff --exit-code -- host/resource_windows_amd64.syso
          rm -rf host/embedded release
          mkdir -p host/embedded release
          python3 - "$server_file" "$rpc_file" host/embedded/runtime.zip <<'PY'
          from pathlib import Path
          from sys import argv
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          with ZipFile(argv[3], 'w', compression=ZIP_DEFLATED, compresslevel=9) as out:
              for source in argv[1:3]:
                  info = ZipInfo(Path(source).name, (2026, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o700 << 16
                  out.writestr(info, Path(source).read_bytes())
          PY
          cp windows/platform-tools-windows.zip host/embedded/platform-tools.zip
          cp packages/YourLM-Android-arm64.apk host/embedded/YourLM-Android-arm64.apk
          server=$(sha256sum "$server_file" | cut -d' ' -f1)
          rpc=$(sha256sum "$rpc_file" | cut -d' ' -f1)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-H=windowsgui -X main.serverHash=$server -X main.rpcHash=$rpc -X main.buildVersion=0.2.0-rc13 -X main.buildCommit=$GITHUB_SHA" \
            -o release/YourLM.exe ./host
          cp packages/YourLM-Android-arm64.apk release/
          (cd release && sha256sum YourLM.exe YourLM-Android-arm64.apk > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Upload validated RC13 package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc13-fast-package
          path: |
            release/YourLM.exe
            release/YourLM-Android-arm64.apk
            release/SHA256SUMS
            go.sum
            host/resource_windows_amd64.syso
          if-no-files-found: error
          retention-days: 14

  windows-install:
    name: Exercise per-user Windows installation
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rc13-fast-package
          path: ${{ runner.temp }}/rc13
      - name: Compile and test Windows cleanup safeguards
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'host\embedded' | Out-Null
          @('runtime.zip', 'platform-tools.zip', 'YourLM-Android-arm64.apk') | ForEach-Object {
            [IO.File]::WriteAllBytes((Join-Path 'host\embedded' $_), [byte[]]@())
          }
          try {
            go test -mod=vendor ./host
            if ($LASTEXITCODE -ne 0) { throw 'Windows Go tests failed' }
          } finally { Remove-Item -Recurse -Force 'host\embedded' }
      - name: Verify Menu Start, Installed Apps, downgrade protection, and uninstall
        shell: pwsh
        run: tests/windows-install-smoke.ps1 "$env:RUNNER_TEMP\rc13"

  publish:
    name: Publish v0.2.0-rc13
    needs: [validate, windows-install]
    if: ${{ contains(github.event.head_commit.message, '[publish rc13 fast]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rc13-fast-package
          path: .
      - name: Publish RC13 after Windows installation passes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          tag=v0.2.0-rc13
          assets=(release/YourLM.exe release/YourLM-Android-arm64.apk release/SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --prerelease --title 'YourLM 0.2.0-rc13' \
              --notes-file windows/RELEASE-NOTES-0.2.0-rc13.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --prerelease --target "$GITHUB_SHA" \
              --title 'YourLM 0.2.0-rc13' --notes-file windows/RELEASE-NOTES-0.2.0-rc13.md \
              --repo "$GITHUB_REPOSITORY"
          fi
