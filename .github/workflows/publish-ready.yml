name: Publish maximum-memory RC3

on:
  push:
    branches: [arena/395e51e3-your-lm]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish rc3]') || contains(github.event.head_commit.message, '[validate fast]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - name: Reuse the already-built pinned Windows runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-standalone-build
          path: ${{ runner.temp }}/base
          github-token: ${{ github.token }}
          run-id: '44800067367'
      - name: Test and build the updated standalone EXE
        shell: bash
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l host/*.go)
          [[ -z "$unformatted" ]] || { echo "Go files need gofmt: $unformatted" >&2; exit 1; }
          go test ./host
          go vet ./...
          node --check host/web/app.js
          server_file="$RUNNER_TEMP/base/release-scan/llama-server.exe"
          rpc_file="$RUNNER_TEMP/base/release-scan/ggml-rpc-server.exe"
          test -s "$server_file"
          test -s "$rpc_file"
          test -s packages/YourLM-Android-arm64.apk
          rm -rf host/embedded release
          mkdir -p host/embedded release
          python3 - "$server_file" "$rpc_file" host/embedded/runtime.zip <<'PY'
          from pathlib import Path
          from sys import argv
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          with ZipFile(argv[3], 'w', compression=ZIP_DEFLATED, compresslevel=9) as out:
              for source in argv[1:3]:
                  info = ZipInfo(Path(source).name, (2026, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o700 << 16
                  out.writestr(info, Path(source).read_bytes())
          PY
          cp windows/platform-tools-windows.zip host/embedded/platform-tools.zip
          cp packages/YourLM-Android-arm64.apk host/embedded/YourLM-Android-arm64.apk
          server=$(sha256sum "$server_file" | cut -d' ' -f1)
          rpc=$(sha256sum "$rpc_file" | cut -d' ' -f1)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-H=windowsgui -X main.serverHash=$server -X main.rpcHash=$rpc -X main.buildVersion=0.2.0-rc3 -X main.buildCommit=$GITHUB_SHA" \
            -o release/YourLM.exe ./host
          cp packages/YourLM-Android-arm64.apk release/
          (cd release && sha256sum YourLM.exe YourLM-Android-arm64.apk > SHA256SUMS && sha256sum -c SHA256SUMS)
      - name: Publish RC3
        if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish rc3]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.2.0-rc3
          assets=(release/YourLM.exe release/YourLM-Android-arm64.apk release/SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --prerelease --title 'YourLM 0.2.0-rc3' \
              --notes-file windows/RELEASE-NOTES-0.2.0-rc3.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --prerelease --target "$GITHUB_SHA" \
              --title 'YourLM 0.2.0-rc3' --notes-file windows/RELEASE-NOTES-0.2.0-rc3.md \
              --repo "$GITHUB_REPOSITORY"
          fi
