name: Windows security gate

on:
  push:
    branches: [arena/395e51e3-your-lm]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android ARM64 NDK + runtime gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
      - name: Fetch pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin c0b97be0b297177a88df08e96c01420976bb18d0
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
      - name: Build and inspect Android ARM64 PIE executables
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export LLAMA_SRC="$RUNNER_TEMP/llama.cpp"
          export JOBS=2
          scripts/build-native.sh build/android-native
      - name: Execute exact ARM64 payloads inside Android
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.38.0
        with:
          api-level: 30
          target: default
          arch: arm64-v8a
          cores: 2
          ram-size: 3072M
          disable-linux-hw-accel: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb push build/android-native/bin/ggml-rpc-server /data/local/tmp/ggml-rpc-server
            adb push build/android-native/bin/llama-server /data/local/tmp/llama-server
            adb shell chmod 700 /data/local/tmp/ggml-rpc-server /data/local/tmp/llama-server
            timeout 45 adb shell /data/local/tmp/ggml-rpc-server --help | tee /tmp/rpc-help.txt
            timeout 45 adb shell /data/local/tmp/llama-server --version | tee /tmp/server-version.txt
            grep -q 'Usage:' /tmp/rpc-help.txt
            grep -q 'version:' /tmp/server-version.txt
      - name: Upload runtime-validated ARM64 engines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64-engines
          path: |
            build/android-native/bin/ggml-rpc-server
            build/android-native/bin/llama-server
          if-no-files-found: error
          retention-days: 7

  defender:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Inspect and scan release files with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus
          $status | Select-Object AMServiceEnabled, AntivirusEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            throw 'Microsoft Defender is not enabled on this runner; refusing to report a pass.'
          }
          Update-MpSignature
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $scanner)) { throw 'MpCmdRun.exe not found' }
          $files = @(
            'packages\YourLM-Windows-x64\YourLM.exe',
            'packages\YourLM-Windows-x64\runtime\llama-server.exe',
            'packages\YourLM-Windows-x64\runtime\ggml-rpc-server.exe',
            'packages\YourLM-Windows-x64-0.1.1.zip',
            'YourLM-0.1.1.zip'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            Get-FileHash -Algorithm SHA256 $file | Format-List
            if ($file.EndsWith('.exe')) { Get-AuthenticodeSignature $file | Select-Object Path, Status, StatusMessage | Format-List }
            & $scanner -Scan -ScanType 3 -File (Resolve-Path $file) -DisableRemediation
            if ($LASTEXITCODE -ne 0) { throw "Defender rejected $file (exit $LASTEXITCODE)" }
          }
          $detections = Get-MpThreatDetection | Where-Object { $_.Resources -match 'YourLM|llama-server|ggml-rpc-server' }
          if ($detections) {
            $detections | Format-List *
            throw 'Defender reported a release-file detection.'
          }
