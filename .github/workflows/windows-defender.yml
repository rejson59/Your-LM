name: Release security gates

on:
  push:
    branches: [arena/395e51e3-your-lm]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-arm64:
    name: Android ARM64 release gate
    if: ${{ !contains(github.event.head_commit.message, '[publish-rc]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
      - name: Fetch pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin c0b97be0b297177a88df08e96c01420976bb18d0
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
      - name: Build and inspect Android ARM64 PIE executables
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export LLAMA_SRC="$RUNNER_TEMP/llama.cpp"
          export JOBS=2
          scripts/build-native.sh build/android-native
      - name: Assemble a gate-signed APK from the exact payloads
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/android-gate.jks" \
            -storepass yourlm-gate -keypass yourlm-gate -alias yourlm \
            -dname "CN=YourLM CI" -keyalg RSA -keysize 2048 -validity 2
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export KEYSTORE="$RUNNER_TEMP/android-gate.jks"
          export KS_PASS=yourlm-gate
          export RPC_BIN="$PWD/build/android-native/bin/ggml-rpc-server"
          export SERVER_BIN="$PWD/build/android-native/bin/llama-server"
          scripts/package-android.sh
      - name: Upload Android ARM64 build inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-arm64-build
          path: |
            build/android-native/bin/ggml-rpc-server
            build/android-native/bin/llama-server
            packages/YourLM-Android-arm64.apk
          if-no-files-found: error
          retention-days: 7

  android-runtime:
    name: Android x86_64 runtime gate
    if: ${{ !contains(github.event.head_commit.message, '[publish-rc]') }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.25.5
          check-latest: true
          cache: false
      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
      - name: Fetch pinned llama.cpp source
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" remote add origin https://github.com/ggml-org/llama.cpp
          git -C "$RUNNER_TEMP/llama.cpp" fetch --depth 1 origin c0b97be0b297177a88df08e96c01420976bb18d0
          git -C "$RUNNER_TEMP/llama.cpp" checkout --detach FETCH_HEAD
      - name: Build Android x86_64 equivalents
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export LLAMA_SRC="$RUNNER_TEMP/llama.cpp"
          export ANDROID_ABI=x86_64
          export JOBS=2
          scripts/build-native.sh build/android-x86-native
      - name: Assemble the x86_64 emulator test APK
        shell: bash
        run: |
          set -euo pipefail
          : "${JAVA_HOME_17_X64:?macOS runner must provide JDK 17}"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/android-gate.jks" \
            -storepass yourlm-gate -keypass yourlm-gate -alias yourlm \
            -dname "CN=YourLM CI" -keyalg RSA -keysize 2048 -validity 2
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export ANDROID_ABI=x86_64
          export KEYSTORE="$RUNNER_TEMP/android-gate.jks"
          export KS_PASS=yourlm-gate
          export RPC_BIN="$PWD/build/android-x86-native/bin/ggml-rpc-server"
          export SERVER_BIN="$PWD/build/android-x86-native/bin/llama-server"
          export APK_OUT="$RUNNER_TEMP/YourLM-Android-x86_64-test.apk"
          if ! scripts/package-android.sh 2>&1 | tee "$RUNNER_TEMP/package-x86.log"; then
            result=$(tail -40 "$RUNNER_TEMP/package-x86.log")
            result=${result//'%'/'%25'}; result=${result//$'\n'/'%0A'}; result=${result//$'\r'/'%0D'}
            echo "::error title=x86_64 APK packaging failed::$result"
            exit 1
          fi
      - name: Execute equivalent native payloads and UI inside Android x86_64
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          cores: 2
          ram-size: 3072M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb push build/android-x86-native/bin/ggml-rpc-server /data/local/tmp/ggml-rpc-server
            adb push build/android-x86-native/bin/llama-server /data/local/tmp/llama-server
            adb shell chmod 700 /data/local/tmp/ggml-rpc-server /data/local/tmp/llama-server
            python3 - <<'PY'
            import subprocess
            checks = [
                (["adb", "shell", "/data/local/tmp/ggml-rpc-server", "--help"], "/tmp/rpc-help.txt"),
                (["adb", "shell", "/data/local/tmp/llama-server", "--version"], "/tmp/server-version.txt"),
            ]
            for command, path in checks:
                with open(path, "w", encoding="utf-8") as output:
                    subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, timeout=45, check=True)
            PY
            cat /tmp/rpc-help.txt /tmp/server-version.txt
            grep -q 'Usage:' /tmp/rpc-help.txt
            grep -q 'version:' /tmp/server-version.txt
            tests/android-engine-smoke.sh
            tests/android-smoke.sh "$RUNNER_TEMP/YourLM-Android-x86_64-test.apk"
      - name: Upload Android runtime evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-runtime-evidence
          path: |
            test-output/android-home.png
            test-output/android-worker-ready.png
            test-output/android-worker-ready.xml
            test-output/android-host.png
          if-no-files-found: error
          retention-days: 7

  publish-rc-assets:
    name: Publish RC assets
    if: ${{ contains(github.event.head_commit.message, '[publish-rc]') }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Upload candidate files to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.2-rc1 \
            packages/YourLM-Windows-x64-0.1.2.zip \
            packages/YourLM-Android-arm64.apk \
            packages/SHA256SUMS \
            YourLM-0.1.2.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

  defender:
    if: ${{ !contains(github.event.head_commit.message, '[publish-rc]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Inspect and scan release files with Microsoft Defender
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus
          $status | Select-Object AMServiceEnabled, AntivirusEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            throw 'Microsoft Defender is not enabled on this runner; refusing to report a pass.'
          }
          Update-MpSignature
          $scanner = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $scanner)) { throw 'MpCmdRun.exe not found' }
          $apkDir = Join-Path $env:RUNNER_TEMP 'yourlm-apk'
          New-Item -ItemType Directory -Force $apkDir | Out-Null
          & tar.exe -xf 'packages\YourLM-Android-arm64.apk' -C $apkDir
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract APK for native-payload scanning' }
          $files = @(
            'packages\YourLM-Windows-x64\YourLM.exe',
            'packages\YourLM-Windows-x64\runtime\llama-server.exe',
            'packages\YourLM-Windows-x64\runtime\ggml-rpc-server.exe',
            'packages\YourLM-Windows-x64-0.1.2.zip',
            'packages\YourLM-Android-arm64.apk',
            'YourLM-0.1.2.zip'
          ) + @(
            Get-ChildItem (Join-Path $apkDir 'lib\arm64-v8a\*.so') | ForEach-Object { $_.FullName }
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
            Get-FileHash -Algorithm SHA256 $file | Format-List
            if ($file.EndsWith('.exe')) { Get-AuthenticodeSignature $file | Select-Object Path, Status, StatusMessage | Format-List }
            & $scanner -Scan -ScanType 3 -File (Resolve-Path $file) -DisableRemediation
            if ($LASTEXITCODE -ne 0) { throw "Defender rejected $file (exit $LASTEXITCODE)" }
          }
          $detections = Get-MpThreatDetection | Where-Object { $_.Resources -match 'YourLM|llama-server|ggml-rpc-server|libylm' }
          if ($detections) {
            $detections | Format-List *
            throw 'Defender reported a release-file detection.'
          }
